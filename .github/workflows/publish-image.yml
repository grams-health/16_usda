name: Publish Docker Image
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: test-image
      - run: docker run --rm test-image

  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: contract
          load: true
          tags: contract-image
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest
      - name: Run contract tests
        run: |
          docker run --rm --network host \
            -e PACT_BROKER_URL=${{ vars.PACT_BROKER_URL || 'http://localhost:9292' }} \
            contract-image

  publish:
    needs: [test, contract-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/grams-health/16_usda:latest
